name: Pages

# Builds the site and deploys it to GitHub Pages.
#
# Triggered by the Bench workflow finishing rather than by a push, so the site
# is always built from a tree whose benchmark tables have already been
# refreshed. Building on push would race: the site reads bench.json at build
# time (concept.md §13.6), and a deploy that started before Bench committed
# would publish yesterday's numbers alongside today's code.

on:
  workflow_run:
    workflows: [Bench]
    types: [completed]
  workflow_dispatch:

# The build job only checks out and uploads an artifact; deployment
# permissions belong to the deploy job alone.
permissions:
  contents: read

# One deployment at a time, and never cancel one in flight: a half-finished
# deploy is a broken site, which is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # A red Bench run means the numbers did not regenerate, so there is nothing
    # new worth publishing.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Bench pushes a commit; check out what it produced rather than the
          # commit that triggered it.
          ref: main

      - name: Is there a site yet?
        id: site
        run: |
          if [ -d apps/web ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "apps/web does not exist yet; nothing to deploy (T38)."
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.site.outputs.present == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.site.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        if: steps.site.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.site.outputs.present == 'true'
        env:
          # Project pages are served from a subpath, and every asset URL has to
          # know it at build time.
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --filter web build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.site.outputs.present == 'true'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.site.outputs.present == 'true'
        with:
          path: apps/web/dist

    outputs:
      present: ${{ steps.site.outputs.present }}

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
