name: Publish

# Publishes a tagged release: npm, PyPI, and a GitHub release carrying the
# single-header C distribution.
#
# Nothing here runs on a fork, so a fork that inherits these workflows and
# happens to push a `v*` tag cannot attempt to publish under someone else's
# name.
#
# Credentials: PyPI uses trusted publishing — a short-lived token minted from
# the workflow's identity, no secret stored anywhere. npm is different and the
# distinction matters: provenance (OIDC) *attests* which workflow built the
# tarball, but authentication is still the long-lived NPM_TOKEN secret, which
# has to exist in the repository settings and deserves the same care as any
# credential. Setting both up is a human step in the repository settings.
#
# Every job is guarded on the repository not being a fork. That was previously
# a comparison against the literal owner `policybook`, which stops a fork from
# publishing but *also* stops the real owner from publishing if the project
# does not live under that account — and it does not: the `policybook` GitHub
# organisation was registered by someone else in 2024. The fork check gives the
# same protection without assuming an account this project may never hold.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # Nothing is published until everything passes. A release that fails its own
  # test suite is worse than a delayed one, and unpublishing is not something
  # either registry makes easy.
  verify:
    name: Verify before publishing
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The CLI tests spawn dist/cli.js; on a fresh checkout the suite cannot
      # pass — or honestly run — without this.
      - name: Build the CLI
        run: |
          pnpm --filter policybook build
          test -f packages/cli/dist/cli.js

      - name: Typecheck, test, validate
        run: |
          pnpm typecheck
          pnpm test
          pnpm check

      - name: The tag and the package version agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          core="$(node -p "require('./packages/core/package.json').version")"
          if [ "$tag" != "$core" ]; then
            echo "tag v$tag does not match packages/core version $core" >&2
            exit 1
          fi
          echo "publishing $core"

  npm:
    name: npm
    needs: verify
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance: npm records which workflow, at which commit, produced the
      # tarball, and anyone can check it.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only the CLI is built. `@policybook/core` ships its TypeScript sources
      # as-is — its `exports` map points at `.ts`, deliberately, so a bundler
      # sees the real types and the site imports the same files the tests run
      # against. The CLI is the one that needs a runnable `dist/cli.js`, since
      # `npx policybook` executes it directly.
      #
      # The filter is the package *name*, `policybook`, not the directory
      # `packages/cli`. `--filter cli` matches nothing and exits zero, which is
      # how it went unnoticed in two of this plan's verify blocks until T37.
      - name: Build the CLI
        run: pnpm --filter policybook build

      - name: Publish core
        run: pnpm --filter @policybook/core publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish the CLI
        run: pnpm --filter policybook publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    name: PyPI
    needs: verify
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/policybook
    permissions:
      contents: read
      # Trusted publishing: PyPI mints a token from this workflow's identity,
      # so there is no API token in the repository at all.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Build
        run: uv build --directory packages/python

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/python/dist

  release:
    name: GitHub release
    needs: verify
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Regenerated rather than taken from the tree, so the header attached to
      # a release provably matches the sources at that tag.
      - name: Regenerate the single header
        run: |
          pnpm tsx scripts/amalgamate-c.ts
          if [ -n "$(git status --porcelain -- packages/c/dist)" ]; then git status --short -- packages/c/dist; git diff -- packages/c/dist; exit 1; fi

      - name: Package the C sources
        run: |
          tar --create --gzip \
            --file "policybook-c-${GITHUB_REF_NAME}.tar.gz" \
            --exclude dist \
            --transform "s,^packages/c,policybook-c-${GITHUB_REF_NAME}," \
            packages/c

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            packages/c/dist/policybook.h
            policybook-c-${{ github.ref_name }}.tar.gz
